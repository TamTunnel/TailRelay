# DEPRECATED: Docker deployment is deprecated and unmaintained.
# Exit-node mode does NOT work in containers (Tailscale userspace mode
# breaks TCP forwarding for exit-node traffic). DIRECT MODE ONLY.
# Use the host binary deployment instead — see README.md.
# This file is kept for existing Docker users; it will be removed in a
# future release.
#
# Tailrelay in Docker — self-contained bridge appliance.
#
# The container runs its OWN tailscaled in the same network namespace as
# WireGuard (tailguard-style isolation). The host does NOT need Tailscale
# installed, and the host's network stack and host Tailscale (if any) are
# never touched.
#
# Firewall: this uses bridge networking, so publish the ports below and
# open UDP 51820 in your cloud firewall / security group (e.g. Oracle NSG).
services:
  tailrelay:
    build:
      context: .
      args:
        VERSION: "0.1.0"
    image: ghcr.io/tamtunnel/tailrelay:0.1.0
    container_name: tailrelay
    cap_add:
      - NET_ADMIN
      - SYS_MODULE # recommended by Tailscale docs for kernel networking
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    ports:
      - "51820:51820/udp" # WireGuard — open this in your cloud firewall/NSG
      # NOTE: do NOT publish 41641/udp if the host already runs Tailscale
      # (port clash). The container's tailscaled works fine via DERP relays
      # without it; direct connections are a latency optimization only.
      # DEPRECATED: binding 8080 to all interfaces exposes the admin UI
      # publicly with no login (container 0.0.0.0 is exempt from the password
      # requirement). Bind to localhost only, or set TR_ADMIN_PASSWORD.
      - "127.0.0.1:8080:8080" # web UI (also reachable via the container's tailnet IP)
    volumes:
      # persisted state (private keys!). wg0.conf is regenerated from state
      # on every start — do NOT bind-mount it (Docker would create it as a
      # directory if absent and break the interface apply).
      - tailrelay-state:/var/lib/tailrelay
      # Tailscale identity (node keys, login state). Persisted so re-creates
      # keep the same tailnet node instead of registering a new one.
      - tailscale-state:/var/lib/tailscale
    environment:
      # One-time Tailscale login for the container's own node. Generate at
      # https://login.tailscale.com/admin/settings/keys (reusable or one-use).
      # Omit to log in manually via the web UI (Tailscale section).
      # - TS_AUTHKEY=tskey-auth-...
      # - TS_HOSTNAME=tailrelay
      # Web UI: default binds the container's tailnet IP (no password needed
      # over the tailnet). To expose publicly, set TR_BIND_ADDR=0.0.0.0 AND TR_ADMIN_PASSWORD.
      - TR_PORT=8080
      # - TR_ADMIN_PASSWORD=change-me
      # Public IP:port WireGuard clients connect to (your VPS's public IP).
      # - TR_ENDPOINT=203.0.113.1:51820
    restart: unless-stopped

volumes:
  tailrelay-state:
  tailscale-state:
