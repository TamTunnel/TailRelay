name: Weekly rebuild

# Rebuild the Docker image weekly even with no code changes, so the image
# stays fresh. Note: the Tailscale version is PINNED in the Dockerfile
# (TS_VERSION + SHA256 args) — this workflow rebuilds with the pinned
# version. To pick up a new Tailscale release, bump TS_VERSION and both
# SHA256 hashes in the Dockerfile (compute from a trusted download;
# pkgs.tailscale.com publishes no checksum files).
on:
  schedule:
    - cron: '0 3 * * 0' # Sundays 03:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tamtunnel/tailrelay:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
